name: android-ci

on:
  push:
    branches:
    - beta
  pull_request:
    branches:
    - beta
  branch_protection_rule:
    types: [created, completed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4

    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          key.jks
          ~/.android
          ~/Android
          pngquant
        key: ${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/buildSrc/**/*.kt') }}

    - name: Install pngquant
      run: |
        if [ ! -f pngquant ]
        then
          wget -O- https://pngquant.org/pngquant-linux.tar.bz2 | sudo tar xjf - pngquant
        fi
        sudo cp pngquant /bin

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17.X

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''
        log-accepted-android-sdk-licenses: 'false'

    - name: Prepare the signature key
      run: |
        if [ ! -f key.jks ]
        then
          echo "No signature key found, generating a random key..."
          make generate JAVADIR=$JAVA_HOME/bin
        fi

    - name: Build all
      run: ./gradlew clean assemble

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Debug APK
        path: app/build/outputs/apk/debug/FBoard-v*.apk

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: Release APK
        path: app/build/outputs/apk/release/FBoard-v*.apk
