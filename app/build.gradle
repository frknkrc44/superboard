plugins {
    id 'com.android.application'
}

// Create a variable called keystorePropertiesFile, and initialize it to your
// keystore.properties file, in the rootProject folder.
def keystorePropertiesFile = rootProject.file("keystore.properties")

// Initialize a new Properties() object called keystoreProperties.
def keystoreProperties = new Properties()

// Load your keystore.properties file into the keystoreProperties object.
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    // TODO: Increase target sdk after 36 released
    compileSdk keystoreProperties['TARGETSDK'].toInteger() - 1

    buildFeatures {
        aidl true
        buildConfig false
        compose false
        prefab false
        renderScript false
        resValues false
        shaders false
        viewBinding false
    }

    androidResources {
        generateLocaleConfig true
    }

    defaultConfig {
        applicationId "org.blinksd.board"
        minSdk keystoreProperties['MINSDK'].toInteger()
        targetSdk keystoreProperties['TARGETSDK'].toInteger()
        versionCode keystoreProperties['VERCODE'].toInteger()
        versionName keystoreProperties['VERNAME']
    }

   signingConfigs {
       debug {
           keyAlias keystoreProperties['KEYALIAS']
           keyPassword keystoreProperties['KEYPASS']
           storeFile file(keystoreProperties['KEYFILE'])
           storePassword keystoreProperties['STOREPASS']
       }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace android.defaultConfig.applicationId
}

dependencies {
    implementation 'com.github.frknkrc44:superminidb:b05b17d'
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "${rootProject.name}-v${variant.versionName}-${variant.buildType.name}.apk"
    }
}

preBuild.dependsOn ':pre'
